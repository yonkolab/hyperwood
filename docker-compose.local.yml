services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hyperwood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hyperwood-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hyperwood"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hyperwood
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - hyperwood-node-modules:/app/node_modules
    command: sh ./scripts/docker/dev-entrypoint.sh

  docs:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app/docs/developer
    environment:
      DOCS_DEV_HOST: ${DOCS_DEV_HOST:-0.0.0.0}
      DOCS_DEV_PORT: ${DOCS_DEV_PORT:-3001}
      DOCS_API_REFERENCE_URL: ${DOCS_API_REFERENCE_URL:-http://localhost:8081/reference/}
    ports:
      - "${DOCS_DEV_PORT:-3001}:${DOCS_DEV_PORT:-3001}"
    volumes:
      - .:/app
      - hyperwood-docs-node-modules:/app/docs/developer/node_modules
    command:
      - sh
      - -c
      - npm install && npm run start -- --host ${DOCS_DEV_HOST:-0.0.0.0} --port ${DOCS_DEV_PORT:-3001}

volumes:
  hyperwood-postgres-data:
  hyperwood-node-modules:
  hyperwood-docs-node-modules:
