SessionBearer:
  type: http
  scheme: bearer
  bearerFormat: opaque session token
  description: Bearer session token returned by `POST /api/v1/auth/login` or MFA verification.

BootstrapToken:
  type: apiKey
  in: header
  name: x-bootstrap-token
  description: Compatibility bootstrap token for private administrative endpoints.

OperatorToken:
  type: apiKey
  in: header
  name: x-operator-token
  description: Scoped operator API token for internal administrative endpoints.

ApiKeyHeader:
  type: apiKey
  in: header
  name: x-api-key
  description: Raw API key or API key prefix depending on the endpoint.
