Position:
  type: object
  required: [marketId, marketSlug, marketTitle, outcome, quantity, averageEntryPriceBps, costBasisMinor]
  properties:
    marketId:
      type: string
      format: uuid
    marketSlug:
      type: string
    marketTitle:
      type: string
    outcome:
      type: string
      enum: [yes, no]
    quantity:
      type: integer
    averageEntryPriceBps:
      type: integer
    costBasisMinor:
      type: integer

Fill:
  type: object
  required:
    - tradeId
    - marketId
    - marketSlug
    - marketTitle
    - orderId
    - role
    - side
    - outcome
    - normalizedOutcome
    - priceBps
    - quantity
    - costBasisMinor
    - executedAt
  properties:
    tradeId:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    marketSlug:
      type: string
    marketTitle:
      type: string
    orderId:
      type: string
      format: uuid
    role:
      type: string
      enum: [maker, taker]
    side:
      type: string
      enum: [buy, sell]
    outcome:
      type: string
      enum: [yes, no]
    normalizedOutcome:
      type: string
      enum: [yes, no]
    priceBps:
      type: integer
    quantity:
      type: integer
    costBasisMinor:
      type: integer
    executedAt:
      type: string
      format: date-time

LedgerActivity:
  type: object
  required: [transactionId, referenceType, referenceId, metadata, createdAt, impacts]
  properties:
    transactionId:
      type: string
      format: uuid
    referenceType:
      type: string
    referenceId:
      type: string
      nullable: true
    metadata:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time
    impacts:
      type: array
      items:
        type: object
        required: [walletAccountId, walletAccountType, currency, amountMinor]
        properties:
          walletAccountId:
            type: string
            format: uuid
          walletAccountType:
            type: string
          currency:
            type: string
            enum: [USD, BRL]
          amountMinor:
            type: integer

PortfolioSummaryResponse:
  type: object
  required: [currency, cash, positions, recentFills, recentLedgerActivity]
  properties:
    currency:
      type: string
      enum: [USD, BRL]
    cash:
      allOf:
        - $ref: ./common.yaml#/WalletBalance
        - type: object
          required: [restingOrderValueMinor]
          properties:
            restingOrderValueMinor:
              type: integer
    positions:
      type: array
      items:
        $ref: '#/Position'
    recentFills:
      type: array
      items:
        $ref: '#/Fill'
    recentLedgerActivity:
      type: array
      items:
        $ref: '#/LedgerActivity'

FillListResponse:
  type: object
  required: [currency, fills]
  properties:
    currency:
      type: string
      enum: [USD, BRL]
    fills:
      type: array
      items:
        $ref: '#/Fill'

Settlement:
  type: object
  required:
    - settlementId
    - marketId
    - marketSlug
    - marketTitle
    - outcome
    - quantity
    - costBasisMinor
    - payoutMinor
    - netPnlMinor
    - settledAt
  properties:
    settlementId:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    marketSlug:
      type: string
    marketTitle:
      type: string
    outcome:
      type: string
      enum: [yes, no, void]
    quantity:
      type: integer
    costBasisMinor:
      type: integer
    payoutMinor:
      type: integer
    netPnlMinor:
      type: integer
    settledAt:
      type: string
      format: date-time

SettlementListResponse:
  type: object
  required: [currency, settlements]
  properties:
    currency:
      type: string
      enum: [USD, BRL]
    settlements:
      type: array
      items:
        $ref: '#/Settlement'

HistoricalExportJob:
  type: object
  required: [id, scope, status, format, currency, createdAt, completedAt]
  properties:
    id:
      type: string
      format: uuid
    scope:
      type: string
      enum: [account_history]
    status:
      type: string
      enum: [completed]
    format:
      type: string
      enum: [json]
    currency:
      type: string
      enum: [USD, BRL]
    createdAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time

CreateHistoricalExportRequest:
  type: object
  properties:
    currency:
      type: string
      enum: [USD, BRL]
      default: USD

HistoricalExportJobResponse:
  type: object
  required: [exportJob]
  properties:
    exportJob:
      $ref: '#/HistoricalExportJob'

HistoricalExportJobListResponse:
  type: object
  required: [currency, exportJobs]
  properties:
    currency:
      type: string
      enum: [USD, BRL]
    exportJobs:
      type: array
      items:
        $ref: '#/HistoricalExportJob'

HistoricalExportArtifactResponse:
  type: object
  required: [exportJob, artifact]
  properties:
    exportJob:
      $ref: '#/HistoricalExportJob'
    artifact:
      type: object
      additionalProperties: true
