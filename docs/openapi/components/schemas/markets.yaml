CreateEventRequest:
  type: object
  required: [slug, title, category]
  properties:
    slug:
      type: string
    title:
      type: string
    summary:
      type: string
    category:
      type: string
    startsAt:
      type: string
      format: date-time
    endsAt:
      type: string
      format: date-time

CreateEventResponse:
  type: object
  required: [event]
  properties:
    event:
      $ref: ./common.yaml#/MarketEvent

UpdateEventRequest:
  type: object
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 160
    summary:
      type: string
      nullable: true
      maxLength: 2000
    endsAt:
      type: string
      format: date-time
      nullable: true

CreateMarketRequest:
  type: object
  required:
    - eventId
    - slug
    - title
    - currency
    - status
    - resolutionRules
    - yesPriceBps
    - noPriceBps
  properties:
    eventId:
      type: string
      format: uuid
    slug:
      type: string
    title:
      type: string
    summary:
      type: string
    currency:
      $ref: ./common.yaml#/CurrencyCode
    status:
      type: string
      enum: [draft, scheduled, active, halted, trading_closed, awaiting_resolution, settled, cancelled, disputed, voided]
    tags:
      type: array
      items:
        type: string
    resolutionRules:
      type: string
    resolutionSources:
      type: array
      items:
        type: string
        format: uri
    yesPriceBps:
      type: integer
    noPriceBps:
      type: integer
    volumeUsdMinor:
      type: integer
    opensAt:
      type: string
      format: date-time
    closesAt:
      type: string
      format: date-time
    resolvesAt:
      type: string
      format: date-time

UpdateMarketClosingRequest:
  type: object
  required: [closesAt]
  properties:
    closesAt:
      type: string
      format: date-time
      nullable: true
      description: New closing timestamp. Send null to clear the schedule.
    resolvesAt:
      type: string
      format: date-time
      nullable: true
      description: Optional new resolution timestamp. Must not be earlier than closesAt.
    changedBy:
      type: string
      minLength: 3
      maxLength: 128
      description: Optional actor label recorded with the change.

CreateMarketResponse:
  type: object
  required: [market]
  properties:
    market:
      $ref: ./common.yaml#/MarketRecord

UpdateMarketDetailsRequest:
  type: object
  minProperties: 1
  properties:
    title:
      type: string
      minLength: 3
      maxLength: 160
    summary:
      type: string
      nullable: true
      maxLength: 2000
    tags:
      type: array
      maxItems: 16
      items:
        type: string
        minLength: 1
        maxLength: 64
    resolutionRules:
      type: string
      minLength: 3
      maxLength: 4000
    resolutionSources:
      type: array
      maxItems: 16
      items:
        type: string
        format: uri
    yesPriceBps:
      type: integer
      minimum: 0
      maximum: 10000
    noPriceBps:
      type: integer
      minimum: 0
      maximum: 10000
    closesAt:
      type: string
      format: date-time
      nullable: true
    resolvesAt:
      type: string
      format: date-time
      nullable: true

MarketListResponse:
  type: object
  required: [filters, categories, eventGroups, markets]
  properties:
    filters:
      type: object
      required: [category, status, tag, search, sort]
      properties:
        category:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        search:
          type: string
          nullable: true
        sort:
          type: string
    categories:
      type: array
      items:
        type: string
    eventGroups:
      type: array
      items:
        type: object
        required: [eventId, eventSlug, eventTitle, category, marketIds]
        properties:
          eventId:
            type: string
            format: uuid
          eventSlug:
            type: string
          eventTitle:
            type: string
          category:
            type: string
          marketIds:
            type: array
            items:
              type: string
              format: uuid
    markets:
      type: array
      items:
        $ref: ./common.yaml#/MarketRecord

MarketDetailResponse:
  type: object
  required: [market]
  properties:
    market:
      allOf:
        - $ref: ./common.yaml#/MarketRecord
        - type: object
          required: [resolutionRules, resolutionSources, statusTimeline, statusTransitions, lastCommandSequence, resolution, settlement]
          properties:
            resolutionRules:
              type: string
            resolutionSources:
              type: array
              items:
                type: string
            statusTimeline:
              type: array
              items:
                type: object
                required: [milestone, at]
                properties:
                  milestone:
                    type: string
                  at:
                    type: string
                    format: date-time
            statusTransitions:
              type: array
              items:
                $ref: '#/MarketStatusTransition'
            lastCommandSequence:
              type: integer
            resolution:
              $ref: '#/MarketResolution'
            settlement:
              $ref: '#/MarketSettlement'

MarketAnnouncement:
  type: object
  required: [id, marketId, title, message, publishedBy, publishedAt, createdAt]
  properties:
    id:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    title:
      type: string
    message:
      type: string
    publishedBy:
      type: string
      nullable: true
    publishedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time

MarketAnnouncementListResponse:
  type: object
  required: [marketId, announcements]
  properties:
    marketId:
      type: string
      format: uuid
    announcements:
      type: array
      items:
        $ref: '#/MarketAnnouncement'

HistoricalCandle:
  type: object
  required:
    - bucketStart
    - bucketEnd
    - openPriceBps
    - highPriceBps
    - lowPriceBps
    - closePriceBps
    - volume
    - tradeCount
  properties:
    bucketStart:
      type: string
      format: date-time
    bucketEnd:
      type: string
      format: date-time
    openPriceBps:
      type: integer
    highPriceBps:
      type: integer
    lowPriceBps:
      type: integer
    closePriceBps:
      type: integer
    volume:
      type: integer
    tradeCount:
      type: integer

HistoricalCandleListResponse:
  type: object
  required: [marketId, interval, candles]
  properties:
    marketId:
      type: string
      format: uuid
    interval:
      type: string
      enum: [1h, 1d]
    candles:
      type: array
      items:
        $ref: '#/HistoricalCandle'

PublishMarketAnnouncementRequest:
  type: object
  required: [title, message]
  properties:
    title:
      type: string
    message:
      type: string
    publishedBy:
      type: string

PublishMarketAnnouncementResponse:
  type: object
  required: [market, announcement]
  properties:
    market:
      type: object
      required: [id, slug, title, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [draft, scheduled, active, halted, trading_closed, awaiting_resolution, settled, cancelled, disputed, voided]
    announcement:
      $ref: '#/MarketAnnouncement'

UpdateMarketStatusRequest:
  type: object
  required: [status, reason]
  properties:
    status:
      type: string
      enum: [draft, scheduled, active, halted, trading_closed, awaiting_resolution, settled, cancelled, disputed, voided]
    reason:
      type: string
    changedBy:
      type: string

ResolveMarketRequest:
  type: object
  required: [outcome, evidenceSummary]
  properties:
    outcome:
      type: string
      enum: [yes, no, void]
    evidenceSummary:
      type: string
    evidenceSources:
      type: array
      items:
        type: string
        format: uri
    approvedBy:
      type: string

InternalMarketState:
  type: object
  required:
    - id
    - eventId
    - slug
    - title
    - status
    - currency
    - tags
    - resolutionRules
    - resolutionSources
    - yesPriceBps
    - noPriceBps
    - volumeUsdMinor
    - lastCommandSequence
    - opensAt
    - closesAt
    - resolvesAt
    - statusChangedAt
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    eventId:
      type: string
      format: uuid
    slug:
      type: string
    title:
      type: string
    summary:
      type: string
      nullable: true
    status:
      type: string
      enum: [draft, scheduled, active, halted, trading_closed, awaiting_resolution, settled, cancelled, disputed, voided]
    currency:
      $ref: ./common.yaml#/CurrencyCode
    tags:
      type: array
      items:
        type: string
    resolutionRules:
      type: string
    resolutionSources:
      type: array
      items:
        type: string
    yesPriceBps:
      type: integer
    noPriceBps:
      type: integer
    volumeUsdMinor:
      type: integer
    lastCommandSequence:
      type: integer
    opensAt:
      type: string
      format: date-time
      nullable: true
    closesAt:
      type: string
      format: date-time
      nullable: true
    resolvesAt:
      type: string
      format: date-time
      nullable: true
    statusChangedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

MarketResolution:
  type: object
  nullable: true
  required: [id, marketId, outcome, evidenceSummary, evidenceSources, approvedBy, approvedAt, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    outcome:
      type: string
      enum: [yes, no, void]
    evidenceSummary:
      type: string
    evidenceSources:
      type: array
      items:
        type: string
    approvedBy:
      type: string
      nullable: true
    approvedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

MarketStatusTransition:
  type: object
  required: [id, marketId, fromStatus, toStatus, reason, changedBy, createdAt]
  properties:
    id:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    fromStatus:
      type: string
      nullable: true
      enum: [draft, scheduled, active, halted, trading_closed, awaiting_resolution, settled, cancelled, disputed, voided]
    toStatus:
      type: string
      enum: [draft, scheduled, active, halted, trading_closed, awaiting_resolution, settled, cancelled, disputed, voided]
    reason:
      type: string
    changedBy:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time

UpdateMarketStatusResponse:
  type: object
  required: [market, alreadyApplied]
  properties:
    market:
      $ref: '#/InternalMarketState'
    transition:
      $ref: '#/MarketStatusTransition'
    alreadyApplied:
      type: boolean

MarketSettlement:
  type: object
  nullable: true
  required: [id, marketId, resolutionId, outcome, settledAt, totalPayoutMinor, affectedUserCount, metadata, createdAt]
  properties:
    id:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    resolutionId:
      type: string
      format: uuid
    outcome:
      type: string
      enum: [yes, no, void]
    settledAt:
      type: string
      format: date-time
    totalPayoutMinor:
      type: integer
    affectedUserCount:
      type: integer
    metadata:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time

ResolveMarketResponse:
  type: object
  required: [market, resolution]
  properties:
    market:
      $ref: '#/InternalMarketState'
    resolution:
      $ref: '#/MarketResolution'

SettlementPayout:
  type: object
  required: [userId, marketId, outcome, quantity, costBasisMinor, payoutMinor, netPnlMinor, currency]
  properties:
    userId:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    outcome:
      type: string
      enum: [yes, no, void]
    quantity:
      type: integer
    costBasisMinor:
      type: integer
    payoutMinor:
      type: integer
    netPnlMinor:
      type: integer
    currency:
      $ref: ./common.yaml#/CurrencyCode

SettleMarketResponse:
  type: object
  required: [marketId, alreadySettled, resolution, settlement, payouts]
  properties:
    marketId:
      type: string
      format: uuid
    alreadySettled:
      type: boolean
    market:
      $ref: '#/InternalMarketState'
    resolution:
      $ref: '#/MarketResolution'
    settlement:
      $ref: '#/MarketSettlement'
    payouts:
      type: array
      items:
        $ref: '#/SettlementPayout'

OrderBookSideLevel:
  type: object
  required: [priceBps, quantity, orderCount]
  properties:
    priceBps:
      type: integer
    quantity:
      type: integer
    orderCount:
      type: integer

OutcomeBook:
  type: object
  required: [bestBidPriceBps, bestAskPriceBps, bids, asks]
  properties:
    bestBidPriceBps:
      type: integer
      nullable: true
    bestAskPriceBps:
      type: integer
      nullable: true
    bids:
      type: array
      items:
        $ref: '#/OrderBookSideLevel'
    asks:
      type: array
      items:
        $ref: '#/OrderBookSideLevel'

OrderBookSnapshotResponse:
  type: object
  required: [marketId, snapshot, books]
  properties:
    marketId:
      type: string
      format: uuid
    snapshot:
      type: object
      required: [asOf, sequence, sequenceToken, totalPriceLevels]
      properties:
        asOf:
          type: string
          format: date-time
        sequence:
          type: integer
        sequenceToken:
          type: string
        totalPriceLevels:
          type: integer
    books:
      type: object
      required: [yes, no]
      properties:
        yes:
          $ref: '#/OutcomeBook'
        no:
          $ref: '#/OutcomeBook'

OrderBookDeltaResponse:
  type: object
  required: [marketId, recovery, deltas]
  properties:
    marketId:
      type: string
      format: uuid
    recovery:
      type: object
      required: [requestedAfterSequence, latestSequence, hasMore, nextAfterSequence, sequenceToken]
      properties:
        requestedAfterSequence:
          type: integer
        latestSequence:
          type: integer
        hasMore:
          type: boolean
        nextAfterSequence:
          type: integer
          nullable: true
        sequenceToken:
          type: string
    deltas:
      type: array
      items:
        type: object
        required: [id, sequence, occurredAt, commandType, bookEffect, affectsBook, order, metadata]
        properties:
          id:
            type: string
            format: uuid
          sequence:
            type: integer
          occurredAt:
            type: string
            format: date-time
          commandType:
            type: string
            enum: [order_create, order_cancel, match_execution]
          bookEffect:
            type: string
          affectsBook:
            type: boolean
          order:
            type: object
            required: [id, type, side, outcome, quantity, limitPriceBps, referencePriceBps, reservedAmountMinor, currency, stateAtSequence]
            properties:
              id:
                type: string
                format: uuid
              type:
                type: string
                enum: [limit, market]
              side:
                type: string
                enum: [buy, sell]
              outcome:
                type: string
                enum: [yes, no]
              quantity:
                type: integer
              limitPriceBps:
                type: integer
                nullable: true
              referencePriceBps:
                type: integer
              reservedAmountMinor:
                type: integer
              currency:
                $ref: ./common.yaml#/CurrencyCode
              stateAtSequence:
                type: string
          trade:
            type: object
            nullable: true
            properties:
              tradeId:
                type: string
              makerOrderId:
                type: string
              takerOrderId:
                type: string
              outcome:
                type: string
                enum: [yes, no]
              priceBps:
                type: integer
              quantity:
                type: integer
          metadata:
            type: object
            additionalProperties: true

Trade:
  type: object
  required: [id, marketId, makerOrderId, takerOrderId, outcome, priceBps, quantity, executedAt]
  properties:
    id:
      type: string
      format: uuid
    marketId:
      type: string
      format: uuid
    makerOrderId:
      type: string
      format: uuid
    takerOrderId:
      type: string
      format: uuid
    outcome:
      type: string
      enum: [yes, no]
    priceBps:
      type: integer
    quantity:
      type: integer
    makerRemainingQuantity:
      type: integer
    takerRemainingQuantity:
      type: integer
    executedAt:
      type: string
      format: date-time

TradeListResponse:
  type: object
  required: [marketId, trades]
  properties:
    marketId:
      type: string
      format: uuid
    trades:
      type: array
      items:
        $ref: '#/Trade'

MatchRunResponse:
  type: object
  required: [marketId, trades, commandEvents]
  properties:
    marketId:
      type: string
      format: uuid
    trades:
      type: array
      items:
        $ref: '#/Trade'
    commandEvents:
      type: array
      items:
        $ref: ./common.yaml#/MarketCommand
