ExchangeScheduleWindow:
  type: object
  required: [weekday, opensAt, closesAt]
  properties:
    weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    opensAt:
      type: string
      pattern: '^\d{2}:\d{2}$'
    closesAt:
      type: string
      pattern: '^\d{2}:\d{2}$'

ExchangeMaintenanceWindow:
  type: object
  required: [startsAt, endsAt, message]
  properties:
    startsAt:
      type: string
      format: date-time
    endsAt:
      type: string
      format: date-time
    message:
      type: string

ExchangeSchedule:
  type: object
  required: [id, name, timezone, weeklyWindows, maintenanceWindows, notes, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    timezone:
      type: string
    weeklyWindows:
      type: array
      items:
        $ref: '#/ExchangeScheduleWindow'
    maintenanceWindows:
      type: array
      items:
        $ref: '#/ExchangeMaintenanceWindow'
    notes:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ExchangeScheduleResponse:
  type: object
  required: [schedule]
  properties:
    schedule:
      $ref: '#/ExchangeSchedule'

UpsertExchangeScheduleRequest:
  type: object
  required: [name, timezone, weeklyWindows, maintenanceWindows]
  properties:
    name:
      type: string
    timezone:
      type: string
    weeklyWindows:
      type: array
      items:
        $ref: '#/ExchangeScheduleWindow'
    maintenanceWindows:
      type: array
      items:
        $ref: '#/ExchangeMaintenanceWindow'
    notes:
      type: string

UpsertExchangeScheduleResponse:
  type: object
  required: [created, schedule]
  properties:
    created:
      type: boolean
    schedule:
      $ref: '#/ExchangeSchedule'
