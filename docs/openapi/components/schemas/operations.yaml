OperationsReviewQueueResponse:
  type: object
  required: [generatedAt, withdrawalReviews, reconciliationInvestigations]
  properties:
    generatedAt:
      type: string
      format: date-time
    withdrawalReviews:
      type: array
      items:
        type: object
        required: [withdrawalId, amountMinor, currency, requestedAt, user, fundingMethod, reviewContext]
        properties:
          withdrawalId:
            type: string
            format: uuid
          amountMinor:
            type: integer
          currency:
            type: string
            enum: [USD, BRL]
          requestedAt:
            type: string
            format: date-time
          user:
            type: object
            required: [id, email, region, kycStatus]
            properties:
              id:
                type: string
                format: uuid
              email:
                type: string
                format: email
              region:
                type: string
                nullable: true
              kycStatus:
                type: string
                enum: [pending, approved, rejected, restricted]
          fundingMethod:
            type: object
            required: [id, rail, displayName, countryCode, provider]
            properties:
              id:
                type: string
                format: uuid
              rail:
                type: string
                enum: [ach, fps, pix, wire, debit_card, crypto_wallet]
              displayName:
                type: string
              countryCode:
                type: string
              provider:
                type: string
                nullable: true
          reviewContext:
            type: object
            required: [reason, thresholdMinor, metadata]
            properties:
              reason:
                type: string
              thresholdMinor:
                type: integer
                nullable: true
              metadata:
                type: object
                additionalProperties: true
    reconciliationInvestigations:
      type: array
      items:
        type: object
        required: [discrepancyId, discrepancyType, severity, expectedStatus, actualStatus, message, detectedAt, metadata, run, transfer]
        properties:
          discrepancyId:
            type: string
            format: uuid
          discrepancyType:
            type: string
          severity:
            type: string
          expectedStatus:
            type: string
            nullable: true
          actualStatus:
            type: string
            nullable: true
          message:
            type: string
          detectedAt:
            type: string
            format: date-time
          metadata:
            type: object
            additionalProperties: true
          run:
            type: object
            required: [id, provider, status, completedAt]
            properties:
              id:
                type: string
                format: uuid
              provider:
                type: string
                nullable: true
              status:
                type: string
              completedAt:
                type: string
                format: date-time
          transfer:
            type: object
            nullable: true
            properties:
              id:
                type: string
                format: uuid
              type:
                type: string
              status:
                type: string
              amountMinor:
                type: integer
              currency:
                type: string
                enum: [USD, BRL]
              requestedAt:
                type: string
                format: date-time
              user:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  region:
                    type: string
                    nullable: true
                  kycStatus:
                    type: string
              fundingMethod:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                    format: uuid
                  rail:
                    type: string
                  displayName:
                    type: string

AuditEvent:
  type: object
  required: [id, action, actor, targetType, targetId, payload, createdAt]
  properties:
    id:
      type: string
      format: uuid
    action:
      type: string
    actor:
      type: string
      nullable: true
    targetType:
      type: string
    targetId:
      type: string
    payload:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time

AuditEventListResponse:
  type: object
  required: [generatedAt, events]
  properties:
    generatedAt:
      type: string
      format: date-time
    events:
      type: array
      items:
        $ref: '#/AuditEvent'

RateLimitEvent:
  type: object
  required: [id, bucket, scopeType, scopeKey, method, path, limit, observedCount, windowStartedAt, windowEndsAt, metadata, createdAt]
  properties:
    id:
      type: string
      format: uuid
    bucket:
      type: string
    scopeType:
      type: string
      enum: [api_key, email, ip]
    scopeKey:
      type: string
    method:
      type: string
    path:
      type: string
    limit:
      type: integer
    observedCount:
      type: integer
    requestIp:
      type: string
      nullable: true
    windowStartedAt:
      type: string
      format: date-time
    windowEndsAt:
      type: string
      format: date-time
    metadata:
      type: object
      additionalProperties: true
    createdAt:
      type: string
      format: date-time

RateLimitEventListResponse:
  type: object
  required: [generatedAt, events]
  properties:
    generatedAt:
      type: string
      format: date-time
    events:
      type: array
      items:
        $ref: '#/RateLimitEvent'

OperationsAlert:
  type: object
  required:
    [id, category, severity, status, sourceType, sourceId, message, metadata, acknowledgedAt, resolvedAt, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    category:
      type: string
    severity:
      type: string
      enum: [warning, critical]
    status:
      type: string
      enum: [open, acknowledged, resolved]
    sourceType:
      type: string
    sourceId:
      type: string
    message:
      type: string
    metadata:
      type: object
      additionalProperties: true
    acknowledgedAt:
      type: string
      format: date-time
      nullable: true
    resolvedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

OperationsAlertListResponse:
  type: object
  required: [generatedAt, alerts]
  properties:
    generatedAt:
      type: string
      format: date-time
    alerts:
      type: array
      items:
        $ref: '#/OperationsAlert'

ImbalancedLedgerTransaction:
  type: object
  required:
    [transactionId, currency, currencyCount, debitTotalMinor, creditTotalMinor, createdAt]
  properties:
    transactionId:
      type: string
      format: uuid
    currency:
      type: string
      nullable: true
    currencyCount:
      type: integer
    debitTotalMinor:
      type: integer
    creditTotalMinor:
      type: integer
    createdAt:
      type: string
      format: date-time

NegativeWalletBalance:
  type: object
  required:
    [walletAccountId, ownerUserId, walletAccountType, currency, balanceMinor, createdAt]
  properties:
    walletAccountId:
      type: string
      format: uuid
    ownerUserId:
      type: string
      format: uuid
      nullable: true
    walletAccountType:
      type: string
    currency:
      type: string
      enum: [USD, BRL]
    balanceMinor:
      type: integer
    createdAt:
      type: string
      format: date-time

LedgerInvariantScanResponse:
  type: object
  required:
    [generatedAt, alertsCreated, imbalancedTransactions, negativeWalletBalances]
  properties:
    generatedAt:
      type: string
      format: date-time
    alertsCreated:
      type: integer
    imbalancedTransactions:
      type: array
      items:
        $ref: '#/ImbalancedLedgerTransaction'
    negativeWalletBalances:
      type: array
      items:
        $ref: '#/NegativeWalletBalance'

SettlementFailureCandidate:
  type: object
  required:
    [marketId, marketTitle, marketCurrency, marketStatus, resolutionId, outcome, approvedAt]
  properties:
    marketId:
      type: string
      format: uuid
    marketTitle:
      type: string
    marketCurrency:
      type: string
      enum: [USD, BRL]
    marketStatus:
      type: string
    resolutionId:
      type: string
      format: uuid
    outcome:
      type: string
      enum: [yes, no, void]
    approvedAt:
      type: string
      format: date-time

SettlementFailureScanResponse:
  type: object
  required: [generatedAt, thresholdMinutes, alertsCreated, stalledSettlements]
  properties:
    generatedAt:
      type: string
      format: date-time
    thresholdMinutes:
      type: integer
    alertsCreated:
      type: integer
    stalledSettlements:
      type: array
      items:
        $ref: '#/SettlementFailureCandidate'

CrossedOutcome:
  type: object
  required: [outcome, bestBidPriceBps, bestAskPriceBps]
  properties:
    outcome:
      type: string
      enum: [yes, no]
    bestBidPriceBps:
      type: integer
    bestAskPriceBps:
      type: integer

TradingConditionCandidate:
  type: object
  required:
    [marketId, marketTitle, marketCurrency, marketStatus, crossedOutcomes]
  properties:
    marketId:
      type: string
      format: uuid
    marketTitle:
      type: string
    marketCurrency:
      type: string
      enum: [USD, BRL]
    marketStatus:
      type: string
    crossedOutcomes:
      type: array
      items:
        $ref: '#/CrossedOutcome'

TradingConditionScanResponse:
  type: object
  required: [generatedAt, alertsCreated, affectedMarkets]
  properties:
    generatedAt:
      type: string
      format: date-time
    alertsCreated:
      type: integer
    affectedMarkets:
      type: array
      items:
        $ref: '#/TradingConditionCandidate'
