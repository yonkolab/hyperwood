register:
  post:
    operationId: registerUser
    tags: [Identity]
    summary: Register a password-based user
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/RegisterRequest
    responses:
      '201':
        description: User registered, verification challenge issued, and delivery outcome recorded.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/VerificationResponse
      '429':
        $ref: ../components/responses/common.yaml#/TooManyRequests
      '409':
        $ref: ../components/responses/common.yaml#/Conflict
      '500':
        $ref: ../components/responses/common.yaml#/InternalError

login:
  post:
    operationId: loginUser
    tags: [Identity]
    summary: Log in with email and password
    security: []
    description: May either return a session token or an MFA challenge depending on the user's configuration.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/LoginRequest
    responses:
      '200':
        description: Successful login or MFA challenge.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas/identity.yaml#/LoginSessionResponse
                - $ref: ../components/schemas/identity.yaml#/LoginMfaChallengeResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '429':
        $ref: ../components/responses/common.yaml#/TooManyRequests

oauthProviders:
  get:
    operationId: getOAuthProviders
    tags: [Identity]
    summary: List configured social login providers
    security: []
    responses:
      '200':
        description: Provider availability for sign-in and registration.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/OAuthProvidersResponse

oauthAuthorize:
  get:
    operationId: authorizeOAuthLogin
    tags: [Identity]
    summary: Start an OAuth authorization-code flow
    security: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, apple]
    responses:
      '302':
        description: Redirect to the selected identity provider.
      '503':
        description: The selected provider is not configured.

oauthCallback:
  get:
    operationId: callbackOAuthLogin
    tags: [Identity]
    summary: Receive a Google OAuth authorization response
    security: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, apple]
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
    responses:
      '302':
        description: Redirect to the frontend social-auth callback.
  post:
    operationId: callbackAppleOAuthLogin
    tags: [Identity]
    summary: Receive Apple's form-post authorization response
    security: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, apple]
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              code:
                type: string
              state:
                type: string
              error:
                type: string
    responses:
      '302':
        description: Redirect to the frontend social-auth callback.

oauthExchange:
  post:
    operationId: exchangeOAuthLoginCode
    tags: [Identity]
    summary: Exchange a one-time OAuth login code for an application session
    security: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, apple]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/OAuthExchangeRequest
    responses:
      '200':
        description: Successful login or MFA challenge.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/schemas/identity.yaml#/LoginSessionResponse
                - $ref: ../components/schemas/identity.yaml#/LoginMfaChallengeResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

requestEmailVerification:
  post:
    operationId: requestEmailVerification
    tags: [Identity]
    summary: Request a new email verification challenge
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/EmailRequest
    responses:
      '201':
        description: Verification challenge created and delivery outcome recorded.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/VerificationResponse
      '429':
        $ref: ../components/responses/common.yaml#/TooManyRequests
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

verifyEmail:
  post:
    operationId: verifyEmail
    tags: [Identity]
    summary: Verify an email challenge token
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/VerifyEmailRequest
    responses:
      '200':
        description: Email verified and user activated.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/VerifyEmailResponse
      '429':
        $ref: ../components/responses/common.yaml#/TooManyRequests
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict
      '410':
        $ref: ../components/responses/common.yaml#/Gone

emailProviderWebhook:
  post:
    operationId: receiveEmailProviderWebhook
    tags: [Identity]
    summary: Receive signed transactional email webhook callbacks
    security: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [mailersend]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      '202':
        description: Webhook received and accepted for processing.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/EmailWebhookAckResponse
      '400':
        $ref: ../components/responses/common.yaml#/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

verifyTotpLogin:
  post:
    operationId: verifyTotpLogin
    tags: [Identity]
    summary: Complete MFA login with a TOTP code
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/TotpVerifyLoginRequest
    responses:
      '200':
        description: MFA challenge completed and session issued.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/LoginSessionResponse
      '429':
        $ref: ../components/responses/common.yaml#/TooManyRequests
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict
      '410':
        $ref: ../components/responses/common.yaml#/Gone

authorizeTotp:
  post:
    operationId: authorizeSensitiveAction
    tags: [Identity]
    summary: Request a short-lived MFA authorization token
    security:
      - SessionBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/TotpAuthorizeRequest
    responses:
      '201':
        description: MFA authorization issued.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/TotpAuthorizationResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

authMe:
  get:
    operationId: getAuthenticatedUser
    tags: [Identity]
    summary: Get the authenticated user
    security:
      - SessionBearer: []
    responses:
      '200':
        description: Current user.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/AuthMeResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

sessions:
  get:
    operationId: listSessions
    tags: [Identity]
    summary: List authenticated sessions
    security:
      - SessionBearer: []
    responses:
      '200':
        description: Sessions owned by the current user.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/SessionListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

currentSession:
  delete:
    operationId: revokeCurrentSession
    tags: [Identity]
    summary: Revoke the current authenticated session
    security:
      - SessionBearer: []
    responses:
      '200':
        description: Current session revoked.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/RevokeSessionResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

sessionById:
  delete:
    operationId: revokeSession
    tags: [Identity]
    summary: Revoke one authenticated session by id
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/SessionId
    responses:
      '200':
        description: Session revoked.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/RevokeSessionResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

apiKeys:
  post:
    operationId: createApiKey
    tags: [Identity]
    summary: Create an API key
    description: Requires an MFA authorization token when the user has active MFA configured.
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MfaAuthorization
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/CreateApiKeyRequest
    responses:
      '201':
        description: API key created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/CreateApiKeyResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/common.yaml#/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict
  get:
    operationId: listApiKeys
    tags: [Identity]
    summary: List API keys for the authenticated user
    security:
      - SessionBearer: []
    responses:
      '200':
        description: API keys owned by the current user.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/ApiKeyListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

apiKeyMe:
  get:
    operationId: authenticateApiKey
    tags: [Identity]
    summary: Authenticate using a raw API key
    security:
      - ApiKeyHeader: []
    responses:
      '200':
        description: API key authentication result.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/AuthenticatedUser
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/common.yaml#/Forbidden

apiKeyHmacMe:
  get:
    operationId: authenticateHmacApiKey
    tags: [Identity]
    summary: Authenticate using HMAC-signed API key headers
    security:
      - ApiKeyHeader: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/ApiTimestamp
      - $ref: ../components/parameters/common.yaml#/ApiNonce
      - $ref: ../components/parameters/common.yaml#/ApiSignature
    responses:
      '200':
        description: HMAC API key authentication result.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/AuthenticatedUser
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/common.yaml#/Forbidden

apiKeyById:
  delete:
    operationId: revokeApiKey
    tags: [Identity]
    summary: Revoke an API key
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/ApiKeyId
      - $ref: ../components/parameters/common.yaml#/MfaAuthorization
    responses:
      '200':
        description: API key revoked.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/RevokeApiKeyResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

apiKeyRotate:
  post:
    operationId: rotateApiKey
    tags: [Identity]
    summary: Rotate an API key secret
    description: Replaces the raw secret material for an existing API key and immediately invalidates the previous raw key and HMAC secret.
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/ApiKeyId
      - $ref: ../components/parameters/common.yaml#/MfaAuthorization
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/RotateApiKeyRequest
    responses:
      '200':
        description: API key secret rotated.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/RotateApiKeyResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

totpSetup:
  post:
    operationId: setupTotp
    tags: [Identity]
    summary: Create a TOTP factor setup challenge
    security:
      - SessionBearer: []
    responses:
      '201':
        description: TOTP setup material created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/TotpSetupResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/common.yaml#/Forbidden

totpConfirm:
  post:
    operationId: confirmTotp
    tags: [Identity]
    summary: Confirm a TOTP factor
    security:
      - SessionBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/TotpConfirmRequest
    responses:
      '200':
        description: TOTP factor enabled.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/TotpConfirmResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

linkExistingUser:
  post:
    operationId: linkExistingUser
    tags: [Identity, Internal]
    summary: Link a password identity to an existing user
    security:
      - BootstrapToken: []
      - OperatorToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/LinkExistingUserRequest
    responses:
      '201':
        description: Password identity linked.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/LinkExistingUserResponse
      '403':
        $ref: ../components/responses/common.yaml#/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

operators:
  get:
    operationId: listOperators
    tags: [Identity, Internal]
    summary: List operator principals
    security:
      - BootstrapToken: []
    responses:
      '200':
        description: Operator inventory.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/OperatorListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
  post:
    operationId: createOperator
    tags: [Identity, Internal]
    summary: Create an operator principal
    security:
      - BootstrapToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/CreateOperatorRequest
    responses:
      '201':
        description: Operator created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/CreateOperatorResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

operatorTokens:
  post:
    operationId: createOperatorToken
    tags: [Identity, Internal]
    summary: Create an operator token
    security:
      - BootstrapToken: []
    parameters:
      - name: operatorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/CreateOperatorTokenRequest
    responses:
      '201':
        description: Operator token created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/CreateOperatorTokenResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

operatorTokenById:
  delete:
    operationId: revokeOperatorToken
    tags: [Identity, Internal]
    summary: Revoke an operator token
    security:
      - BootstrapToken: []
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Operator token revoked.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/RevokeOperatorTokenResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
