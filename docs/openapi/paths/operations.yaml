reviews:
  get:
    operationId: listOperationsReviewQueue
    tags: [Operations, Internal]
    summary: List active operations review queues
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit25
    responses:
      '200':
        description: Withdrawal review queue and reconciliation investigation queue.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/OperationsReviewQueueResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

auditEvents:
  get:
    operationId: listOperationsAuditEvents
    tags: [Operations, Internal]
    summary: List administrative audit events
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit25
      - name: targetType
        in: query
        required: false
        schema:
          type: string
      - name: targetId
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Administrative audit events.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/AuditEventListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

rateLimitEvents:
  get:
    operationId: listOperationsRateLimitEvents
    tags: [Operations, Internal]
    summary: List external API rate-limit exceed events
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit25
      - name: bucket
        in: query
        required: false
        schema:
          type: string
      - name: scopeType
        in: query
        required: false
        schema:
          type: string
          enum: [api_key, email, ip]
      - name: scopeKey
        in: query
        required: false
        schema:
          type: string
      - name: path
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Persisted rate-limit exceed events for external API requests.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/RateLimitEventListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

alerts:
  get:
    operationId: listOperationsAlerts
    tags: [Operations, Internal]
    summary: List persisted operational alerts
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit25
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: severity
        in: query
        required: false
        schema:
          type: string
          enum: [warning, critical]
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [open, acknowledged, resolved]
      - name: sourceType
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Persisted operational alerts ordered from newest to oldest.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/OperationsAlertListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

ledgerInvariantScan:
  post:
    operationId: runLedgerInvariantScan
    tags: [Operations, Internal]
    summary: Scan ledger invariants and persist critical alerts
    security:
      - BootstrapToken: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 100
                default: 25
    responses:
      '200':
        description: Scan result with detected invariant failures and created alert count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/LedgerInvariantScanResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

settlementFailureScan:
  post:
    operationId: runSettlementFailureScan
    tags: [Operations, Internal]
    summary: Scan for stalled market settlements and persist critical alerts
    security:
      - BootstrapToken: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 100
                default: 25
    responses:
      '200':
        description: Scan result with resolved-but-unsettled markets and created alert count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/SettlementFailureScanResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

tradingConditionScan:
  post:
    operationId: runTradingConditionScan
    tags: [Operations, Internal]
    summary: Scan active markets for unusual trading conditions and persist critical alerts
    security:
      - BootstrapToken: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 100
                default: 25
    responses:
      '200':
        description: Scan result with affected markets and created alert count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/TradingConditionScanResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

realtimeStreamHealthScan:
  post:
    operationId: runRealtimeStreamHealthScan
    tags: [Operations, Internal]
    summary: Scan live realtime streams for stale subscriptions and persist critical alerts
    security:
      - BootstrapToken: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              limit:
                type: integer
                minimum: 1
                maximum: 100
                default: 25
              maxIdleSeconds:
                type: integer
                minimum: 0
                maximum: 3600
                description: Optional override for the configured staleness threshold.
    responses:
      '200':
        description: Scan result with stale subscriptions and created alert count.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/operations.yaml#/RealtimeStreamHealthScanResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
