portfolio:
  get:
    operationId: getPortfolioSummary
    tags: [Portfolio]
    summary: Get portfolio summary
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Currency
    responses:
      '200':
        description: Portfolio summary for the requested currency.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/PortfolioSummaryResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

stream:
  get:
    operationId: streamAccountRealtime
    tags: [Portfolio]
    summary: Stream authenticated account updates as server-sent events
    description: |
      Opens an authenticated SSE stream for one user and one currency scope.

      The first event is always `account_snapshot`, which contains the current
      portfolio summary, recent fills, and recent settlements for the authenticated
      user and requested currency.

      Subsequent events are typed private account updates such as `order_updated`,
      `balance_updated`, `transfer_updated`, `fill_batch`, and `settlement_updated`.
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Currency
    responses:
      '200':
        description: Open authenticated SSE stream for one user and currency scope.
        content:
          text/event-stream:
            schema:
              type: string
            examples:
              snapshot:
                summary: Initial account snapshot event
                value: |
                  id: 8f2b07de-64a3-4f22-9d5f-1ccfb54684f6
                  event: account_snapshot
                  data: {"id":"8f2b07de-64a3-4f22-9d5f-1ccfb54684f6","type":"account_snapshot","userId":"11111111-1111-1111-1111-111111111111","currency":"USD","emittedAt":"2026-04-21T22:00:00.000Z","data":{"portfolioSummary":{"currency":"USD"},"recentFills":[],"recentSettlements":[]}}
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

fills:
  get:
    operationId: listPortfolioFills
    tags: [Portfolio]
    summary: List fills for the authenticated user
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit50
      - $ref: ../components/parameters/common.yaml#/Currency
    responses:
      '200':
        description: Recent fills.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/FillListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

historicalOrders:
  get:
    operationId: listHistoricalPortfolioOrders
    tags: [Portfolio]
    summary: List historical orders for the authenticated user
    description: |
      Returns the authenticated user's order history for one currency, ordered
      newest first. This is a dedicated historical review path and is not limited
      to archived markets.
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit50
      - $ref: ../components/parameters/common.yaml#/Currency
    responses:
      '200':
        description: Historical order records for the requested currency.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/HistoricalOrderListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

historicalFills:
  get:
    operationId: listHistoricalPortfolioFills
    tags: [Portfolio]
    summary: List historical fills for the authenticated user
    description: |
      Returns the authenticated user's fill history through a dedicated historical
      route. The payload shape matches the primary fills response.
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit50
      - $ref: ../components/parameters/common.yaml#/Currency
    responses:
      '200':
        description: Historical fills for the requested currency.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/FillListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

settlements:
  get:
    operationId: listPortfolioSettlements
    tags: [Portfolio]
    summary: List settled position outcomes for the authenticated user
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit50
      - $ref: ../components/parameters/common.yaml#/Currency
    responses:
      '200':
        description: Recent settlement results.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/SettlementListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

exports:
  get:
    operationId: listPortfolioExports
    tags: [Portfolio]
    summary: List account history export jobs for the authenticated user
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Limit25
      - $ref: ../components/parameters/common.yaml#/Currency
    responses:
      '200':
        description: Historical export jobs for the requested currency.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/HistoricalExportJobListResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
  post:
    operationId: createPortfolioExport
    tags: [Portfolio]
    summary: Create an account history export job
    security:
      - SessionBearer: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/portfolio.yaml#/CreateHistoricalExportRequest
    responses:
      '201':
        description: Historical export job created and completed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/HistoricalExportJobResponse
      '400':
        $ref: ../components/responses/common.yaml#/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

exportById:
  get:
    operationId: getPortfolioExport
    tags: [Portfolio]
    summary: Fetch a completed account history export artifact
    security:
      - SessionBearer: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/ExportJobId
    responses:
      '200':
        description: Completed account history export artifact.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/portfolio.yaml#/HistoricalExportArtifactResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
