markets:
  get:
    operationId: listMarkets
    tags: [Markets]
    summary: List markets
    security: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/Category
      - $ref: ../components/parameters/common.yaml#/MarketStatus
      - $ref: ../components/parameters/common.yaml#/Tag
      - $ref: ../components/parameters/common.yaml#/Search
      - $ref: ../components/parameters/common.yaml#/MarketSort
      - $ref: ../components/parameters/common.yaml#/Limit25
    responses:
      '200':
        description: Market catalog listing.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/MarketListResponse

marketById:
  get:
    operationId: getMarket
    tags: [Markets]
    summary: Get market detail
    security: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    responses:
      '200':
        description: Market detail.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/MarketDetailResponse
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

orderBook:
  get:
    operationId: getOrderBookSnapshot
    tags: [Markets]
    summary: Get current order book snapshot
    security: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    responses:
      '200':
        description: Current order book snapshot.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/OrderBookSnapshotResponse
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

orderBookDeltas:
  get:
    operationId: getOrderBookDeltas
    tags: [Markets]
    summary: Recover order book deltas after a sequence
    security: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
      - $ref: ../components/parameters/common.yaml#/AfterSequence
      - $ref: ../components/parameters/common.yaml#/DeltaLimit
    responses:
      '200':
        description: Sequenced order book deltas.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/OrderBookDeltaResponse
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

trades:
  get:
    operationId: listRecentTrades
    tags: [Markets]
    summary: List recent trades for a market
    security: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
      - $ref: ../components/parameters/common.yaml#/Limit50
    responses:
      '200':
        description: Recent trades.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/TradeListResponse
      '410':
        $ref: ../components/responses/common.yaml#/Gone
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

historicalTrades:
  get:
    operationId: listHistoricalMarketTrades
    tags: [Markets]
    summary: List archived trades for a historical market
    security: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
      - $ref: ../components/parameters/common.yaml#/Limit50
    responses:
      '200':
        description: Archived trades for a historical market.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/TradeListResponse
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

announcements:
  get:
    operationId: listMarketAnnouncements
    tags: [Markets]
    summary: List published announcements for a market
    security: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    responses:
      '200':
        description: Market announcement history ordered newest first.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/MarketAnnouncementListResponse
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

internalEvents:
  post:
    operationId: createMarketEvent
    tags: [Markets, Internal]
    summary: Create a market event
    security:
      - BootstrapToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/markets.yaml#/CreateEventRequest
    responses:
      '201':
        description: Event created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/CreateEventResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized

internalMarkets:
  post:
    operationId: createMarket
    tags: [Markets, Internal]
    summary: Create a market
    security:
      - BootstrapToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/markets.yaml#/CreateMarketRequest
    responses:
      '201':
        description: Market created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/CreateMarketResponse
      '400':
        $ref: ../components/responses/common.yaml#/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

internalMatch:
  post:
    operationId: runLimitOrderMatching
    tags: [Markets, Internal]
    summary: Run bounded limit order matching for a market
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    responses:
      '200':
        description: Matching run result.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/MatchRunResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

internalAnnouncements:
  post:
    operationId: publishMarketAnnouncement
    tags: [Markets, Internal]
    summary: Publish a market announcement
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/markets.yaml#/PublishMarketAnnouncementRequest
    responses:
      '201':
        description: Market announcement published.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/PublishMarketAnnouncementResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound

internalStatus:
  post:
    operationId: updateMarketStatus
    tags: [Markets, Internal]
    summary: Apply an internal lifecycle status transition to a market
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/markets.yaml#/UpdateMarketStatusRequest
    responses:
      '200':
        description: Market status transition applied or already in the requested state.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/UpdateMarketStatusResponse
      '400':
        $ref: ../components/responses/common.yaml#/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

internalResolve:
  post:
    operationId: resolveMarket
    tags: [Markets, Internal]
    summary: Record a final resolution outcome for a market
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/markets.yaml#/ResolveMarketRequest
    responses:
      '200':
        description: Market resolution recorded.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/ResolveMarketResponse
      '400':
        $ref: ../components/responses/common.yaml#/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict

internalSettle:
  post:
    operationId: settleMarket
    tags: [Markets, Internal]
    summary: Settle all positions for a resolved market
    security:
      - BootstrapToken: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/MarketId
    responses:
      '200':
        description: Market was already settled and the existing settlement is returned.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/SettleMarketResponse
      '201':
        description: Market settlement completed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/markets.yaml#/SettleMarketResponse
      '401':
        $ref: ../components/responses/common.yaml#/Unauthorized
      '404':
        $ref: ../components/responses/common.yaml#/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/Conflict
