openapi: 3.0.3
info:
  title: Hyperwood API
  version: 0.1.0
  description: |
    Hyperwood is a prediction market API covering identity, compliance, funding, trading,
    portfolio, and internal operations workflows.

    This OpenAPI document is the source of truth for the HTTP API surface. It documents the
    currently implemented REST endpoints under `/api/v1`.

    Notes:
    - Public read-only endpoints exist for market discovery and health checks.
    - Authenticated endpoints use opaque bearer session tokens unless documented otherwise.
    - Internal endpoints use the `x-bootstrap-token` header.
    - External API routes are rate-limited. Public auth routes use a stricter bucket than general API traffic.
    - Webhooks and realtime transports are not implemented yet and are documented as future work in `/docs/guides`.
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
    description: Basic service availability checks.
  - name: Identity
    description: Registration, login, MFA, sessions, and API key workflows.
  - name: Compliance
    description: Compliance profile and capability evaluation workflows.
  - name: Funding
    description: Wallet, funding methods, deposits, withdrawals, and reconciliation.
  - name: Exchange
    description: Exchange-wide schedule and operating metadata.
  - name: Markets
    description: Public market catalog, detail, order book, and matching operations.
  - name: Orders
    description: Authenticated order entry and cancellation.
  - name: Portfolio
    description: Portfolio summary, fills, and ledger-derived read models.
  - name: Operations
    description: Internal review queue and operational investigation endpoints.
  - name: Internal
    description: Bootstrap-protected internal administrative endpoints.
